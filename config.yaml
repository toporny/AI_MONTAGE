# ANALIZA WIDEO
video_analysis:
  # Częstotliwość próbkowania klatek do analizy (w sekundach, np. 0.2s = 5 klatek na sekundę dla proxy 15fps)
  sample_interval_sec: 0.2

  # Model detekcji obiektów/ludzi (yolov8n.pt, yolov8s.pt, yolov8m.pt, yolo11n.pt)
  yolo_model: "yolov8n.pt"

  # Urządzenie obliczeniowe ('cuda' dla GPU NVIDIA lub 'cpu')
  device: "cuda"

  # Batch size dla inferencji AI
  batch_size: 16

  # Długości okien czasowych do wyszukiwania highlightów wewnątrz scen (w sekundach)
  highlight_window_sizes: [1.0, 1.5, 2.0, 3.0, 4.0]

  # Minimalny próg zmiany sceny w scenedetect (AdaptiveDetector / ContentDetector)
  scene_threshold: 27.0
  min_scene_duration_sec: 0.8

# WAGI SYSTEMU SCORINGU DLA ANALIZY WIDEO (0.0 - 1.0)
scoring_weights:
  # Waga ostrości obrazu (Laplacian variance)
  sharpness: 0.20

  # Waga detekcji ludzi i twarzy (obecność osób, wielkość, kadrowanie)
  people: 0.35

  # Waga ruchu i dynamiki w kadrze (Optical Flow)
  motion: 0.25

  # Waga kompozycji (wyśrodkowanie postaci, brak uciętych krawędzi)
  composition: 0.20

  # KARY
  # Kara za motion blur / nieostrość
  blur_penalty: 0.35

  # Kara za niedoświetlenie / prześwietlenie kadru
  exposure_penalty: 0.30

  # Kara za niestabilność / przypadkowe szarpnięcia kamerą
  camera_shake_penalty: 0.25

# ANALIZA MUZYKI
music_analysis:
  # Czułość detekcji beatów i onsetów (0.0 - 1.0)
  onset_sensitivity: 0.5

  # Liczba beatów w jednym takcie (domyślnie 4 dla metrum 4/4)
  beats_per_bar: 4

  # Okno wygładzania krzywej energii (w sekundach)
  energy_smoothing_sec: 0.5

  # Progi klasyfikacji poziomów energii muzycznej (0.0 - 1.0)
  energy_thresholds:
    calm: 0.30
    medium: 0.60
    high: 0.80
    drop_peak: 0.85

# ZASADY MONTAŻU I RYTMU (DŁUGOŚCI UJĘĆ ZALEŻNIE OD ENERGII)
montage_rules:
  # Bezwzględny minimalny czas trwania pojedynczego ujęcia (w sekundach) - zapobiega epilepsji / zbyt szybkim cięciom
  min_cut_duration_sec: 1.20

  # Zakresy długości ujęć (w sekundach) dla każdego poziomu energii
  cut_durations:
    drop_or_climax:
      min_sec: 1.20
      max_sec: 2.20
      beat_interval: 4      # Cięcie co 4 beaty (1 takt)
    high_energy:
      min_sec: 1.50
      max_sec: 2.80
      beat_interval: 4      # Cięcie co 4 beaty (1 takt)
    medium_energy:
      min_sec: 2.20
      max_sec: 4.20
      beat_interval: 8      # Cięcie co 8 beatów (2 takty)
    calm:
      min_sec: 3.50
      max_sec: 6.50
      beat_interval: 12     # Cięcie co 12 beatów (3 takty)

  # Wyrównywanie cięć do siatki beatów
  snap_to_beat: true
  snap_tolerance_sec: 0.15

  # Rezerwacja najlepszych ujęć (top X procent) wyłącznie na dropy i kulminacje
  reserve_top_highlights_for_drops_ratio: 0.15

  # Chronologia i prowadzenie narracji (układanie ujęć zgodnie z osią czasu nagrania)
  chronology:
    enabled: true
    weight: 50.0                    # Waga kary za odchylenie od osi czasu chronologicznej (0 - 100)
    local_window_tolerance: 0.12    # Tolerancja lokalna (12% osi czasu) na dobór najlepszych ujęć w danym bloku
    backward_jump_penalty: 35.0     # Kara za cofanie się w czasie względem poprzedniego ujęcia

  # Kary za powtórzenia i brak różnorodności (0 - 100)
  penalties:
    # Kara za powtórzenie tego samego typu kadru pod rząd (np. Close-up -> Close-up)
    consecutive_shot_type_penalty: 30.0

    # Kara za ponowne użycie tego samego pliku źródłowego
    clip_reuse_penalty: 60.0

    # Maksymalna dopuszczalna liczba użyć jednego pliku źródłowego w całym filmie (1 = każde ujęcie unikalne)
    max_source_clip_uses: 1

# USTAWIENIA RENDERERA (Uniwersalne GPU & CPU)
rendering:
  # Szybki podgląd roboczy (Preview Draft - niska jakość, błyskawiczny rendering)
  preview:
    resolution: [640, 360]    # 360p / draft
    fps: 15
    codec: "auto"             # "auto" (automatycznie NVENC / AMF / QSV / libx264) lub wprost: "h264_nvenc", "h264_amf", "libx264"
    cq: 34                    # Niska jakość / mały rozmiar pliku (im niżej, tym lepiej)
    preset: "p1"              # Szybki preset (NVENC: p1, AMF: speed, CPU: ultrafast)
    audio_bitrate: "128k"

  # Finalny Master Render
  final:
    resolution: [3840, 2160]  # 4K UHD — zmień na [1920, 1080] dla Full HD
    fps: 60                   # Zmień na 30 lub 25 zależnie od materiału źródłowego
    codec: "auto"             # "auto" (automatycznie HEVC NVENC / AMF / QSV / libx264) lub wprost: "hevc_nvenc", "hevc_amf", "hevc_qsv", "libx264"
    cq: 19                    # Bardzo wysoka jakość master (14 = maksymalna, 19 = optymalna)
    preset: "p6"              # NVENC: p6, AMF: quality, CPU: fast
    tune: "hq"
    audio_codec: "aac"
    audio_bitrate: "320k"
    hwaccel: "auto"           # "auto", "cuda" lub "none"
