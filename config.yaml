# ==============================================================================
# KONFIGURACJA INTELIGENTNEGO SYSTEMU AUTOMATYCZNEGO MONTAŻU AI
# ==============================================================================
# Skopiuj ten plik do katalogu swojego projektu i dostosuj ścieżki.
# Wszystkie ścieżki mogą być absolutne (c:/Users/...) lub względne do
# katalogu, w którym znajduje się ten plik config.yaml.
# ==============================================================================

# ŚCIEŻKI DO KATALOGÓW I PLIKÓW
paths:
  # Katalog z plikami proxy 480p/15 fps do szybkiej analizy
  proxy_dir: "kopie_robocze_480p"

  # Katalog z oryginalnymi plikami 4K/60 fps do finalnego renderingu
  original_dir: "materialy_oryginalne"

  # Katalog z plikami muzycznymi MP3
  music_dir: "sciezkadzwiekowa"

  # Wybrany plik MP3 do montażu (wymagana dokładna nazwa pliku w music_dir lub ścieżka)
  music_file: "Płomień (Catchy Power Remix)(3).mp3"

  # Katalogi robocze (względne do lokalizacji config.yaml)
  cache_dir: "analysis"
  storyboard_dir: "storyboard"
  preview_dir: "preview"
  output_dir: "output"

  # Statyczny obraz końcowy zastępujący ostatnie ujęcie montażu (opcjonalne)
  # Zostaw puste ("") jeśli chcesz używać normalnego klipu wideo jako outro
  # Przykład: "outro_image/outro.jpg"
  outro_image: "outro_image/outro.jpg"

# OUTRO WIDEO (alternatywa dla outro_image)
# Słowo kluczowe w nazwie pliku proxy — klip zawierający to słowo
# zostanie zarezerwowany jako ostatnie ujęcie (outro wideo).
# Ustaw na "" jeśli nie chcesz rezerwować żadnego klipu jako outro wideo.
# Przykłady: "powrot", "outro", "koniec", "wyjazd", "driving"
outro_video_keyword: ""

# ==============================================================================
# LISTA WYMUSZONYCH UJĘĆ
# ==============================================================================
# Ujęcia z tej listy ZAWSZE znajdą się w finalnym montażu.
# Program wybierze najlepszy fragment z danego klipu (ostrość, osoby, ruch)
# i przytnie go do odpowiedniej długości dopasowanej do rytmu muzyki.
#
# WAŻNE — DOPASOWANIE ŚCISŁE (exact match):
#   Pole "file" musi być DOKŁADNĄ nazwą pliku (bez rozszerzenia i bez _480p15).
#   Jeśli plik nie istnieje w kopie_robocze_480p/ → program zakończy się błędem (ABORT).
#
#   Skąd wziąć nazwę pliku?
#   → Otwórz katalog kopie_robocze_480p/
#   → Znajdź interesujący cię plik, np.: 29_125240_piata_mowczyni_na_scenie_b_480p15.mp4
#   → Wpisz jego nazwę BEZ _480p15 i BEZ .mp4, czyli: 29_125240_piata_mowczyni_na_scenie_b
#   → Możesz też wpisać pełną nazwę z _480p15 lub z .mp4 — program sam odtnie sufiks
#
# Każda pozycja na liście:
#   file: (wymagane) dokładna nazwa pliku (patrz wyżej)
#   clip_time:  (opcjonalne) punkt startowy wewnątrz Twojego nagrania (od kiedy wycinać)
#               Formaty: "0:03" = od 3. sekundy | "15" = od 15. sekundy nagrania
#               Wszystko przed tą chwilą zostanie pominięte!
#               Długość wycinka dobierze algorytm w rytm muzyki.
#               Pozycja ujęcia na osi utworu jest dobierana automatycznie chronologicznie.
#
# Przykłady:
#   forced_clips:
#     - file: "29_125240_piata_mowczyni_na_scenie_b"
#       clip_time: "0:03"           # zacznij wycinać od 3. sekundy tego klipu
#     - file: "29_130535_ludzie_zbieraja_sie_na_sciance_c"
#     - file: "28_193407_kolacja_wieczorna"
#       clip_time: "0:12"           # od 12. sekundy wideo
# ==============================================================================
forced_clips:
  - file: "29_125240_piata_mowczyni_na_scenie_b"
    clip_time: "0:03"
  - file: "29_235041_magda_geba_i"
    clip_time: "0:00"
